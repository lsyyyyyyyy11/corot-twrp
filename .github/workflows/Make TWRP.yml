name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'MANIFEST_URL (if want to use SSH keys, use git@github.com:XXXXX)'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        # twrp-14.1 (AOSP r67) is required: its manifest ships build/release,
        # whose release_config_map.mk declares the 'ap2a' release. twrp-14 (r17)
        # has no build/release project at all, so _all_release_configs is empty
        # and lunch fails with "No release config found for TARGET_RELEASE".
        default: 'twrp-14.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/qiyuan2403/corot-twrp-device-tree'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/corot'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'corot'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_corot'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Display Run Parameters
      run: |
        echo "::group::User Environment Variables"
        echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
        echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img"
        echo "::endgroup::"
 
    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v3
    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      # That's it! Now use your normal steps

    - name: Prepare the environment
      run: |
        sudo apt update
        # Required build dependencies.
        sudo apt -y install gperf gcc-multilib g++-multilib libc6-dev lib32z1-dev \
          libncurses5-dev libncurses5 libx11-dev tree libgl1-mesa-dev libxml2-utils \
          xsltproc bc ccache lib32readline-dev liblz4-tool libxml2 lzop pngcrush \
          schedtool squashfs-tools imagemagick libbz2-dev lzma qemu-user-static \
          libstdc++-12-dev python3 zip unzip file
        # Optional/legacy packages: harmless if absent on this runner image.
        sudo apt -y install x11proto-core-dev libsdl1.2-dev ncftp || true

    - name: Install OpenJDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.MANIFEST_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.5.4
      with:
          ssh-private-key: |
              ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo
      
    - name: Initialize repo
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
        git config --global user.name "Nico170420"
        git config --global user.email "b170420nc@gmail.com"
        repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
      id: pwd
          
    - name: Repo Sync
      run: |
        repo sync -j$(nproc --all) --force-sync
      working-directory: workspace
      
    - name: Clone device tree
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      # workflow_dispatch passes an unfilled optional input as an empty string,
      # not null, so '!= null' was always true and this step ran
      # `git clone ''` on every build. Test for non-empty instead.
      if: |
        github.event.inputs.COMMON_TREE_URL != ''
        && github.event.inputs.COMMON_PATH != ''
      run: |
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Check Build Tree
      uses: haya14busa/action-cond@v1
      id: buildtree
      with:
        cond: ${{ startsWith(github.event.inputs.MANIFEST_BRANCH, 'twrp-') }}
        if_true: twrp
        if_false: omni

    - name: Sync Device Dependencies
      # This device tree has no scripts/convert.sh and no *.dependencies file
      # (verified: `git ls-files | grep -E 'convert.sh|\.dependencies'` is empty,
      # and the reference tree /tmp/corot_ref is the same). The hard-coded path
      # therefore exited 127, and GitHub's default `bash -e` aborted the step
      # before its `repo sync` could run. It was masked by continue-on-error and
      # is redundant with the "Repo Sync" step above, so guard it the same way as
      # the optional COMMON_TREE_URL input: only run when the file actually exists.
      run: |
        if [ -f "${GITHUB_WORKSPACE}/scripts/convert.sh" ]; then
          bash ${GITHUB_WORKSPACE}/scripts/convert.sh ${{ github.event.inputs.DEVICE_PATH }}/${{ steps.buildtree.outputs.value }}.dependencies
          repo sync -j$(nproc --all)
        else
          echo "no scripts/convert.sh in the device tree; skipping (nothing to convert)"
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Apply TWRP 14.1 fixes (upstream Gerrit patches)
      # TeamWin's android-14.1 branch is missing four fixes that newer TWRP
      # trees already have (all posted on gerrit.twrp.me, branch android-14.1,
      # by the same maintainer and tested on a real SM7450 build):
      #   0001  8742  libtar: stale -ndk_platform AIDL module names -> -ndk
      #   0002  8745  libtar: fscrypt policy API drift + libsysutils link dep
      #   0003  8744  partition/partitionmanager: remove deprecated FDE calls
      #   0004  8745  partition: drop FBE->FDE fallback that cannot compile
      #   0005  8739  prebuilt: add missing task_profiles.json dependency
      #   0006  local: ship keymint-V3-ndk.so (libkeymint_support DT_NEEDED)
      #   0007  local: fix 8745's heap overwrite / th_read/write semantics
      # They are ordered because 0002/0004/0007 expect the files 0001/0003 produce.
      # Patches are taken from the freshly cloned device tree (not from the
      # GITHUB_WORKSPACE checkout of the triggering commit) so the patch set and
      # the source being built always come from the same device-tree revision.
      run: |
        # Absolute path: git -C bootable/recovery resolves relative paths
        # against bootable/recovery, not against this working-directory.
        DT="$(pwd)/${{ github.event.inputs.DEVICE_PATH }}"
        git -C "$DT" log -1 --oneline
        for PATCH in "$DT"/twrp-patches/*.patch; do
          echo "::group::apply $(basename "$PATCH")"
          git -C bootable/recovery apply --verbose "$PATCH"
          echo "::endgroup::"
        done
        echo "patched files:"
        git -C bootable/recovery status --short
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building recovery
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-ap2a-eng
        # Build the patched libtar modules first: they are the twrp-14.1 FBE
        # blocker, so failing here costs minutes instead of a whole build.
        echo "::group::libtar compile check"
        make libtar libtar_static -j$(nproc --all)
        echo "::endgroup::"
        # Fresh runner, so no 'make clean' is needed.
        make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/vendor_boot.img
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: vendor_boot.img
          Version:Android14
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
